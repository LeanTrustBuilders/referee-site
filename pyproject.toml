[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "referee-site"
version = "0.9.0"
description = "A Referee-style site for a Lean library, built from an S2 dataset and S3 evidence"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["evidence-core[yaml] @ git+https://github.com/LeanTrustBuilders/evidence-core",
                "evidence-store @ git+https://github.com/LeanTrustBuilders/evidence-store"]

[project.scripts]
referee-site = "referee_site.__main__:main"

[tool.setuptools]
packages = ["referee_site"]

[tool.setuptools.package-data]
referee_site = ["static/*", "static/**/*"]
